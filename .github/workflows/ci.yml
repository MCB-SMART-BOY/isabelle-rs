# Full repository verification is Rust xtask; independent security scans are
# mandatory jobs. Historical ignored diagnostics remain manual-only.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_ignored_diagnostics:
        description: 'Run historically ignored Rust diagnostics separately'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 268435456

jobs:
  verify:
    name: "complete repository verify"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: ./.github/actions/linux-namespaces
      - name: Require fixed official Isabelle checkout
        run: cargo +stable xtask pinned-source
      - run: cargo +stable xtask verify

  xtask-selftest:
    name: "xtask / independent selftest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: ./.github/actions/linux-namespaces
      - run: cargo +stable xtask selftest

  gitleaks:
    name: "security / gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Scan working tree (official pinned image)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 dir . --gitleaks-ignore-path .gitleaksignore --redact

  trivy:
    name: "security / trivy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: trivy@0.76.0
          fallback: none
      - run: trivy fs --exit-code 1 --include-dev-deps .

  cargo-audit:
    name: "security / cargo audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit

  cargo-deny:
    name: "security / cargo deny"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check

  build-macos:
    name: "compile / macos"
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo +stable xtask check

  build-windows:
    name: "compile / windows"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo +stable xtask check

  ignored-diagnostics:
    name: "historically ignored Rust diagnostics (explicit opt-in)"
    if: github.event_name == 'workflow_dispatch' && inputs.run_ignored_diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo +stable xtask test --lib -- --ignored
