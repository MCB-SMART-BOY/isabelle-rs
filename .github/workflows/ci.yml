# Isabelle-rs CI Pipeline
#
# Verification is split by responsibility. Repository-owned scripts define the
# strict-kernel, sampled-core, and documentation gates; every Cargo resolution
# uses the committed lockfile and the stable toolchain.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:  # manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 268435456  # 256MB for BNF/Ctr_Sugar/Lfp

jobs:
  # ==========================================================================
  # Stage 1: Quick Checks (parallel, < 2 min)
  # ==========================================================================

  fmt:
    name: "fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: "clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --locked --lib -- -W clippy::all -D clippy::correctness

  # ==========================================================================
  # Stage 2: Unit Tests (parallel, < 5 min)
  # ==========================================================================

  test-unit-core:
    name: "unit / core"
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - core::thm
          - core::unify
          - core::simplifier
          - core::logic
          - core::tactic
          - core::net
          - core::types
          - core::sorts
          - core::sign
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib ${{ matrix.module }}

  test-unit-isar:
    name: "unit / isar"
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - isar::method
          - isar::proof
          - isar::proof_state
          - isar::term_parser
          - isar::outer_syntax
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib ${{ matrix.module }}

  test-unit-hol:
    name: "unit / hol"
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - hol
          - theory::loader
          - theory::session_builder
          - syntax::printer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib ${{ matrix.module }}

  # ==========================================================================
  # Stage 3: Integration Tests (< 10 min)
  # ==========================================================================

  test-integration:
    name: "integration"
    needs: [test-unit-core, test-unit-isar, test-unit-hol]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Strict kernel gate
        run: bash scripts/dev-check.sh strict
      - name: Sampled core trust snapshot
        run: bash scripts/dev-check.sh core
      - name: BNF/datatype tests
        run: cargo test --locked --test bnf_tests
      - name: Integration tests
        run: cargo test --locked --test integration_tests
      - name: Property-based tests (advisory)
        continue-on-error: true
        run: cargo test --locked --test proptest
      - name: Known-failure baseline (advisory)
        continue-on-error: true
        run: cargo test --locked --lib -- --ignored
      - name: All targets compile
        run: cargo check --locked --all-targets

  # ==========================================================================
  # Stage 4: Extended Checks
  # ==========================================================================

  audit:
    name: "security audit (advisory)"
    needs: [test-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - name: Report RustSec advisories
        continue-on-error: true
        run: cargo audit

  docs:
    name: "docs"
    needs: [test-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/dev-check.sh docs
      - run: cargo doc --locked --no-deps --document-private-items

  release-build:
    name: "release build"
    needs: [test-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release

  # ==========================================================================
  # Platform verification (no tests, just compiles)
  # ==========================================================================

  build-macos:
    name: "build / macos"
    needs: [fmt, clippy]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  build-windows:
    name: "build / windows"
    needs: [fmt, clippy]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
