# Release workflow — triggered by an existing `v*` tag or an explicit manual
# tag input. It builds Linux, macOS, and Windows binaries from that exact tag.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: "release / verify"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Match tag to package version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Run release verification
        run: bash scripts/dev-check.sh all

  # ==========================================================================
  # Build release binaries for all platforms
  # ==========================================================================

  build-linux:
    name: "release / linux"
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-rs-linux-x86_64
          path: |
            target/release/isabelle-rs
            target/release/isabelle-build

  build-macos:
    name: "release / macos"
    needs: [verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-rs-macos-x86_64
          path: |
            target/release/isabelle-rs
            target/release/isabelle-build

  build-windows:
    name: "release / windows"
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-rs-windows-x86_64
          path: |
            target/release/isabelle-rs.exe
            target/release/isabelle-build.exe

  # ==========================================================================
  # Create GitHub Release with all artifacts
  # ==========================================================================

  create-release:
    name: "create release"
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          cd artifacts
          tar czf isabelle-rs-linux-x86_64.tar.gz isabelle-rs-linux-x86_64/
          tar czf isabelle-rs-macos-x86_64.tar.gz isabelle-rs-macos-x86_64/
          zip -r isabelle-rs-windows-x86_64.zip isabelle-rs-windows-x86_64/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/isabelle-rs-linux-x86_64.tar.gz
            artifacts/isabelle-rs-macos-x86_64.tar.gz
            artifacts/isabelle-rs-windows-x86_64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-pre') || contains(env.RELEASE_TAG, '-rc') }}
