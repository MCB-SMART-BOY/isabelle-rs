# Release workflow — triggered by an existing `v*` tag or an explicit manual
# tag input. It builds Linux, macOS, and Windows binaries from that exact tag.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: "release / verify"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Require fixed official Isabelle checkout
        run: cargo +stable xtask pinned-source
      - name: Run release verification
        shell: bash
        run: cargo +stable xtask release-check --tag "$RELEASE_TAG"

  gitleaks:
    name: "release security / gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --no-git --source /repo --redact

  trivy:
    name: "release security / trivy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - uses: taiki-e/install-action@v2
        with:
          tool: trivy@0.67.2
      - run: trivy fs --exit-code 1 --include-dev-deps .

  cargo-audit:
    name: "release security / cargo audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit

  cargo-deny:
    name: "release security / cargo deny"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18.8
      - run: cargo deny check

  # ==========================================================================
  # Build release binaries for all platforms
  # ==========================================================================

  build-linux:
    name: "release / linux"
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable xtask build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-rs-linux-x86_64
          path: |
            target/release/isabelle-rs
            target/release/isabelle-build

  build-macos:
    name: "release / macos"
    needs: [verify]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable xtask build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-rs-macos-x86_64
          path: |
            target/release/isabelle-rs
            target/release/isabelle-build

  build-windows:
    name: "release / windows"
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable xtask build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: isabelle-rs-windows-x86_64
          path: |
            target/release/isabelle-rs.exe
            target/release/isabelle-build.exe

  # ==========================================================================
  # Create GitHub Release with all artifacts
  # ==========================================================================

  create-release:
    name: "create release"
    needs: [build-linux, build-macos, build-windows, gitleaks, trivy, cargo-audit, cargo-deny]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: cargo +stable xtask package --artifacts artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/isabelle-rs-linux-x86_64.tar.gz
            artifacts/isabelle-rs-macos-x86_64.tar.gz
            artifacts/isabelle-rs-windows-x86_64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-pre') || contains(env.RELEASE_TAG, '-rc') }}
