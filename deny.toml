[advisories]
version = 2
unmaintained = "all"
unsound = "all"

# Dependency admission policy, not a license grant for third-party code.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]

# Reviewed BSD exceptions remain package/version scoped. Build metadata is
# ignored by SemVer matching; Cargo.lock retains full versions and checksums.
[[licenses.exceptions]]
name = "zstd"
version = "=0.14.3"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-safe"
version = "=8.2.0"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-sys"
version = "=2.1.2+zstd.1.5.7"
allow = ["BSD-3-Clause"]
