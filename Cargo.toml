[workspace]
members = [".", "crates/kernel", "crates/evidence", "xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
license = "Apache-2.0"

[package]
name = "isabelle-rs"
version = "2.3.0"
rust-version = "1.96.0"
edition = "2024"
description = "Rust research prototype of an Isabelle/Pure-inspired LCF kernel with explicit oracle footprints and partial Isar/HOL tooling."
license.workspace = true
repository = "https://github.com/MCB-SMART-BOY/isabelle-rs"
documentation = "https://docs.rs/isabelle-rs"
readme = "README.md"
keywords = ["isabelle", "theorem-prover", "proof-assistant", "lcf", "hol"]
categories = ["science", "development-tools"]
exclude = [
    "isabelle-source/**",
    "target/**",
    ".git/**",
    "*.bak",
    "tests/proptest.proptest-regressions",
]

[features]
default = []
# LSP server support
lsp = []
# WASM plugin support
wasm = []

[dependencies]
isabelle-kernel = { path = "crates/kernel" }
isabelle-evidence = { path = "crates/evidence" }
base16ct = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "io-std"] }
rowan = "0.17"
wasmtime = { version = "49.0.3", default-features = false, features = ["runtime", "cranelift", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
clap = { version = "4", features = ["derive"] }
sha1 = "0.11"
sha2 = "0.11.1"
lzma-rust2 = { version = "=0.23.0", default-features = false, features = ["std", "encoder", "xz"] }
zstd = { version = "=0.14.3", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1"

# Worker identity hashes scan debug executables twice; keep SHA-256 fast without
# changing product debug checks, cancellation, or pre-spawn authentication.
[profile.dev.package.sha2]
opt-level = 3

[[bench]]
name = "kernel_benchmarks"
harness = false

[[bin]]
name = "isabelle-rs"
path = "src/main.rs"

[[bin]]
name = "isabelle-build"
path = "src/bin/isabelle-build.rs"

[[bin]]
name = "isabelle-profile-hol"
path = "src/bin/isabelle-profile-hol.rs"
